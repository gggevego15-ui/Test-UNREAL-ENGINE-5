name: Build Unity Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'UnityProject/**'
      - '.github/workflows/unity-windows.yml'

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Unity project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: UnityProject
          unityVersion: 6000.0.58f1
          targetPlatform: StandaloneWindows64
          buildMethod: TestUE5.Editor.BuildProject.PerformBuild
          allowDirtyBuild: true

      - name: Verify executable
        shell: bash
        run: |
          test -f UnityProject/Build/Windows/TestUE5.exe || {
            echo "Build did not produce UnityProject/Build/Windows/TestUE5.exe"
            find UnityProject/Build -maxdepth 4 -type f 2>/dev/null || true
            exit 1
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: TestUE5-Unity-Windows
          path: UnityProject/Build/Windows/**
          if-no-files-found: error
          retention-days: 14
